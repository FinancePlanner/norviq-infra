# image.tag is bumped automatically by FinanceBackend CI on merge to main.
image:
  tag: "fe0e8d34d5904a55425af1863215631141d22e66" # set by CI: <git-sha>
env:
  - name: DATABASE_HOST
    value: postgres.data.svc.cluster.local
  - name: DATABASE_PORT
    value: "5432"
  - name: DATABASE_NAME
    value: stockplan_staging
  - name: LOG_LEVEL
    value: debug
  - name: LOG_FORMAT
    value: json
  - name: PROMETHEUS_ENABLED
    value: "true"
  # Retail sentiment (2026-08-21). Social scraping is ON here: with it off the
  # DeepAPI path scores web-search snippets rather than actual retail posts, so
  # the feature would look healthy while measuring the wrong population.
  # Scrapes cost materially more than searches, which is what the tiered
  # universe below is sized against.
  - name: DEEPAPI_SOCIAL_SCRAPING_ENABLED
    value: "true"
  # Tier A: every symbol any user holds or watches. Full source set + LLM themes.
  - name: SENTIMENT_USER_TIER_LIMIT
    value: "500"
  # Tier C: loud symbols nobody holds. Capped hard -- no user is asking for these.
  - name: SENTIMENT_TRENDING_TIER_LIMIT
    value: "50"
  - name: SENTIMENT_WINDOW_DAYS
    value: "7"
  # Daily roll-up runs at 05:00 UTC, after the US close and before EU morning.
  - name: SENTIMENT_AGGREGATION_HOUR_UTC
    value: "5"
  # The only per-symbol LLM spend. Bounded on top of AIDailyCap.
  - name: SENTIMENT_MAX_THEME_SYMBOLS
    value: "150"
  # Raw posts are evidence with a short shelf life; the daily aggregates are the
  # history worth keeping.
  - name: SENTIMENT_POST_RETENTION_DAYS
    value: "90"
  - name: SENTIMENT_DAILY_RETENTION_DAYS
    value: "730"
  # A dry DeepAPI balance suppresses that provider for this long instead of
  # being rediscovered on every one of the hundreds of calls a run makes.
  - name: PROVIDER_CREDIT_COOLDOWN_SECONDS
    value: "21600"
  - name: MACRO_ENABLED
    value: "true"
  - name: MACRO_ALLOW_STUB_FALLBACK
    value: "true"
  - name: MACRO_REFRESH_INTERVAL_SECONDS
    value: "3600"
  - name: MACRO_US_REFRESH_SECONDS
    value: "21600"
  - name: MACRO_INTL_REFRESH_SECONDS
    value: "86400"
  - name: OBS_TRACES_ENABLED
    value: "true"
  - name: OBS_OTLP_ENDPOINT
    value: http://alloy.observability.svc.cluster.local:4317
  - name: TAX_REPORT_STORAGE_PATH
    value: /var/lib/norviq/tax-reports
  - name: ADVANCED_REPORT_STORAGE_PATH
    value: /var/lib/norviq/advanced-reports
  - name: GOTENBERG_BASE_URL
    value: http://gotenberg:3000
  - name: TAX_VALIDATED_JURISDICTIONS
    value: US
  - name: PUBLIC_API_BASE_URL
    value: https://dev-api.norviq.org
  - name: REBALANCING_ENABLED
    value: "true"
  - name: REBALANCING_ALERTS_ENABLED
    value: "true"
  - name: REBALANCING_ALERT_POLL_SECONDS
    value: "300"
  - name: GOAL_PLANNING_ENABLED
    value: "true"
  - name: GOAL_EVALUATOR_ENABLED
    value: "true"
  - name: GOAL_EVALUATOR_INTERVAL_SECONDS
    value: "86400"
persistence:
  enabled: true
  mountPath: /var/lib/norviq/tax-reports
  size: 1Gi
additionalPersistence:
  - name: advanced-reports
    mountPath: /var/lib/norviq/advanced-reports
    size: 2Gi
    accessModes:
      - ReadWriteOnce
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
ingress:
  hosts:
    - dev-api.norviq.org
