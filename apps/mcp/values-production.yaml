# image.tag only changes through a merged promote PR (.github/workflows/promote.yml).
image:
  tag: "bd80997ab34f7eb9bd406c045b41ebbed1ba66bf" # set by promote PR
env:
  - name: BACKEND_BASE_URL
    value: http://api:8080
  # Public authorization-server URL advertised in the RFC 9728 metadata;
  # introspection keeps using the cluster-internal BACKEND_BASE_URL.
  - name: BACKEND_PUBLIC_URL
    value: https://api.norviq.org
  - name: MCP_PUBLIC_URL
    value: https://mcp.norviq.org
  - name: LISTEN_ADDR
    value: ":8087"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
ingress:
  hosts:
    - mcp.norviq.org
