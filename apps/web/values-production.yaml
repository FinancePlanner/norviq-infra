# image.tag only changes through a merged promote PR (.github/workflows/promote.yml).
image:
  tag: "289fd673b9f6dcf6436f8f3f07148fda91cd3e3e" # set by promote PR
env:
  - name: GO_ENV
    value: production
  - name: BACKEND_URL
    value: http://api:8080 # same-namespace service
  - name: PUBLIC_BASE_URL
    # Must match OAUTH_ALLOWED_REDIRECT_URIS (www callbacks). Apex norviq.org is not allowlisted.
    value: https://www.norviq.org
  - name: COOKIE_SECURE
    value: "true"
  - name: SENTRY_ENVIRONMENT
    value: production
resources:
  requests:
    cpu: 50m
    memory: 48Mi
  limits:
    memory: 96Mi
ingress:
  hosts:
    - norviq.org
    - www.norviq.org
